version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: erp-mysql
    ports:
      - "3306:3306"
    volumes:
      - /volume1/docker/erp-mysql:/var/lib/mysql
    environment:
      - MYSQL_ROOT_PASSWORD=rootpassword123
      - MYSQL_DATABASE=erp_db
      - MYSQL_USER=erp_user
      - MYSQL_PASSWORD=erppassword123
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password

  redis:
    image: redis:7-alpine
    container_name: erp-redis
    ports:
      - "6379:6379"
    volumes:
      - /volume1/docker/erp-redis:/data
    restart: unless-stopped

  app:
    build: .
    container_name: erp-app
    ports:
      - "8080:80"
    volumes:
      - ./storage:/var/www/html/storage
      - ./public/uploads:/var/www/html/public/uploads
      - ./.env:/var/www/html/.env
    depends_on:
      - mysql
      - redis
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
    restart: unless-stopped

networks:
  default:
    name: erp-network
